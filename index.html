<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Video Hub</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:white;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  padding:15px 25px;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(10px);
}

/* SEARCH */
input{
  padding:8px;
  border-radius:5px;
  border:none;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  padding:20px;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(12px);
  border-radius:12px;
  padding:10px;
  transition:0.3s;
}
.card:hover{transform:scale(1.05);}

iframe{
  width:100%;
  height:180px;
  border-radius:10px;
}

h2{text-align:center;}
</style>
</head>

<body>

<header>
<h2>🎬 VideoHub</h2>
<input type="text" id="search" placeholder="Search videos...">
</header>

<h2>🔥 All Videos</h2>
<div class="grid" id="videos"></div>

<h2>🎵 Songs</h2>
<div class="grid" id="songs"></div>

<script>

/* =====================
   GENERATE 1100 VIDEOS
===================== */

let videos = [];

for(let i=1;i<=1100;i++){
  videos.push({
    title:"Video "+i,
    link:"https://www.youtube.com/embed/dQw4w9WgXcQ"
  });
}

/* =====================
   SONGS (PRE-FILLED)
===================== */

const songs = [
{title:"Shape of You", link:"https://www.youtube.com/embed/JGwWNGJdvx8"},
{title:"Blinding Lights", link:"https://www.youtube.com/embed/4NRXx6U8ABQ"},
{title:"Believer", link:"https://www.youtube.com/embed/7wtfhZwyrcc"},
{title:"Closer", link:"https://www.youtube.com/embed/PT2_F-1esPk"},
{title:"Faded", link:"https://www.youtube.com/embed/60ItHLz5WEA"},
{title:"On My Way", link:"https://www.youtube.com/embed/dhYOPzcsbGM"},
{title:"Senorita", link:"https://www.youtube.com/embed/Pkh8UtuejGw"},
{title:"Despacito", link:"https://www.youtube.com/embed/kJQP7kiw5Fk"},
{title:"Stay", link:"https://www.youtube.com/embed/kTJczUoc26U"},
{title:"Levitating", link:"https://www.youtube.com/embed/TUVcZfQe-Kw"}
];

/* =====================
   LOAD FUNCTION
===================== */

const videoContainer=document.getElementById("videos");
const songContainer=document.getElementById("songs");

function loadVideos(list){
  videoContainer.innerHTML="";
  list.slice(0,50).forEach(v=>{
    videoContainer.innerHTML+=`
    <div class="card">
      <iframe src="${v.link}" loading="lazy"></iframe>
      <p>${v.title}</p>
    </div>`;
  });
}

/* INITIAL LOAD */
loadVideos(videos);

/* LOAD SONGS */
songs.forEach(s=>{
  songContainer.innerHTML+=`
  <div class="card">
    <iframe src="${s.link}" loading="lazy"></iframe>
    <p>${s.title}</p>
  </div>`;
});

/* SEARCH */
document.getElementById("search").addEventListener("input",e=>{
  const val=e.target.value.toLowerCase();
  const filtered=videos.filter(v=>v.title.toLowerCase().includes(val));
  loadVideos(filtered);
});

</script>

</body>
</html>
