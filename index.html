<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Video & Product Hub</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color:white;
}

/* GLASS EFFECT */
.glass {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    padding:15px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

/* HEADER */
header {
    text-align:center;
    padding:20px;
}

/* GRID */
.grid {
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
    gap:15px;
    padding:20px;
}

/* CARD */
.card {
    transition:0.3s;
}
.card:hover {
    transform:scale(1.05);
}

/* VIDEO */
iframe {
    width:100%;
    height:200px;
    border-radius:10px;
}

/* BUTTON */
.btn {
    display:inline-block;
    padding:8px;
    background:#00c6ff;
    color:black;
    text-decoration:none;
    border-radius:5px;
}

/* SECTION TITLE */
h2 {
    text-align:center;
}

/* ANIMATION */
.fade {
    animation:fadeIn 1s ease-in;
}
@keyframes fadeIn {
    from{opacity:0;}
    to{opacity:1;}
}
</style>
</head>

<body>

<header>
<h1>🔥 Ultimate Video & Product Hub</h1>
<p>Watch. Learn. Shop.</p>
</header>

<!-- VIDEO SECTION -->
<h2>🎥 Videos</h2>
<div class="grid" id="videoContainer"></div>

<!-- PRODUCT SECTION -->
<h2>🛒 Products</h2>
<div class="grid" id="productContainer"></div>

<script>

/* =======================
   VIDEO DATA (ADD HERE)
======================= */

const videos = [

/* Elon Musk (25) */
{title:"Elon Musk Interview 1", link:"https://www.youtube.com/embed/VIDEOID1"},
{title:"Elon Musk Interview 2", link:"https://www.youtube.com/embed/VIDEOID2"},

/* CEOs (25) */
{title:"CEO Interview 1", link:"https://www.youtube.com/embed/VIDEOID3"},

/* PM/President (25) */
{title:"World Leader Interview", link:"https://www.youtube.com/embed/VIDEOID4"},

/* Songs Global (10) */
{title:"Top Global Song", link:"https://www.youtube.com/embed/VIDEOID5"},

/* Country Songs (15) */
{title:"Famous Country Song", link:"https://www.youtube.com/embed/VIDEOID6"}

];


/* =======================
   PRODUCT DATA (ADD HERE)
======================= */

const products = [

{title:"Product 1", img:"https://via.placeholder.com/250", link:"https://example.com"},
{title:"Product 2", img:"https://via.placeholder.com/250", link:"https://example.com"}

];


/* =======================
   AUTO LOAD VIDEOS
======================= */

const videoContainer = document.getElementById("videoContainer");

videos.forEach(v => {
    videoContainer.innerHTML += `
    <div class="card glass fade">
        <iframe src="${v.link}" allowfullscreen></iframe>
        <p>${v.title}</p>
    </div>`;
});


/* =======================
   AUTO LOAD PRODUCTS
======================= */

const productContainer = document.getElementById("productContainer");

products.forEach(p => {
    productContainer.innerHTML += `
    <div class="card glass fade">
        <img src="${p.img}" width="100%">
        <p>${p.title}</p>
        <a href="${p.link}" target="_blank" class="btn">Buy Now</a>
    </div>`;
});

</script>

</body>
</html>
