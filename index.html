<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Glassmorphic Video Hub</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Reusable Card Style */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Fixed Navigation Header */
        nav {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 30px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        /* Main Section Setup */
        .container {
            max-width: 1200px;
            margin: 120px auto 60px auto;
            padding: 20px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 20px;
            text-align: center;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Video Pipeline Grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .video-item {
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
            aspect-ratio: 16/9;
            border-radius: 12px;
        }

        .video-item:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.3);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .video-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Fullscreen Video Overlay Lightbox */
        .video-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .video-modal.open {
            display: flex;
            opacity: 1;
        }

        .close-modal {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 35px;
            color: #fff;
            cursor: pointer;
            transition: color 0.3s;
            z-index: 2100;
        }

        .close-modal:hover {
            color: #ff007f;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <nav class="glass-card">
        <div class="logo">V-STREAM ENGINE</div>
    </nav>

    <div class="container">
        <h1>Mega Video Collection</h1>
        
        <div style="text-align: center; margin-bottom: 30px;">
            <input type="text" id="videoSearchInput" onkeyup="searchVideos()" placeholder="🔍 Gane ka naam ya koi bhi part type karein..." 
                   style="width: 80%; max-width: 600px; padding: 14px 20px; font-size: 16px; background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 30px; color: #fff; outline: none; transition: all 0.3s ease; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);">
        </div>

        <div class="video-grid" id="main-video-grid">
            </div>
    </div>

    <div class="video-modal" id="videoModal"></div>

    <script>
        // 1. APNE YOUTUBE VIDEOS KI IDs YAHAN PASTE KAREIN
        const youtubeVideoIds = [
            "dQw4w9WgXcQ", // Video 1
            "kJQP7kiw5Fk", // Video 2
            "9bZkp7q19f0", // Video 3
            "JGwWNGJdvx8", // Video 4
            "OPf0YbXqDm0", // Video 5
            "tG7wLK4aVq4", // Video 6
            "VbfpW0n50uM", // Video 7
            "YykjpeuMNEk", // Video 8
            "2Vv-BfVoq4g", // Video 9
            "09R8_2nJtjg"  // Video 10
            // Nayi IDs lagane ke liye bas aakhir me comma (,) jor kar likhte chalein
        ];

        // System setup to duplicate list items up-to exact 5000 count scale
        function get5000VideoIds() {
            let fullList = [];
            while(fullList.length < 5000) {
                fullList = fullList.concat(youtubeVideoIds);
            }
            return fullList.slice(0, 5000); 
        }

        const final5000Videos = get5000VideoIds();

        // Load Grid Execution
        function loadVideos() {
            const mainGrid = document.getElementById('main-video-grid');
            let gridHTML = "";
            
            final5000Videos.forEach((id, index) => {
                const thumbnailUrl = `https://img.youtube.com/vi/${id}/mqdefault.jpg`;
                
                gridHTML += `
                    <div class="video-item glass-card" onclick="openYoutubeVideo('${id}')">
                        <img src="${thumbnailUrl}" style="width:100%; height:100%; object-fit:cover;" alt="Thumbnail">
                        <div class="video-overlay">
                            <span><i class="fas fa-play"></i> Video Track #${index + 1}</span>
                            <small>YouTube</small>
                        </div>
                    </div>
                `;
            });
            mainGrid.innerHTML = gridHTML;
        }

        // 🔍 REAL-TIME MIDDLE STRING SEARCH FILTER LOGIC
        function searchVideos() {
            let input = document.getElementById('videoSearchInput').value.toLowerCase();
            let videoItems = document.querySelectorAll('#main-video-grid .video-item');
            
            videoItems.forEach((item) => {
                let titleText = item.querySelector('.video-overlay span').innerText.toLowerCase();
                if (titleText.includes(input)) {
                    item.style.display = "block";
                } else {
                    item.style.display = "none";
                }
            });
        }

        // 🔁 AUTOPLAY ENGINE PIPELINE (YouTube Iframe Web Handler)
        let currentVideoIndex = 0;
        let ytPlayer = null;
        const modal = document.getElementById('videoModal');

        function openYoutubeVideo(id) {
            currentVideoIndex = final5000Videos.indexOf(id);

            modal.innerHTML = `
                <span class="close-modal" onclick="closeVideo()">&times;</span>
                <div id="youtube-iframe-placeholder" style="margin: auto;"></div>
            `;
            modal.classList.add('open');

            if (!window.YT) {
                var tag = document.createElement('script');
                tag.src = "https://www.youtube.com/iframe_api";
                var firstScriptTag = document.getElementsByTagName('script')[0];
                firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
                
                window.onYouTubeIframeAPIReady = function() {
                    createYTPlayer(id);
                }
            } else {
                createYTPlayer(id);
            }
        }

        function createYTPlayer(id) {
            ytPlayer = new YT.Player('youtube-iframe-placeholder', {
                height: '100%',
                width: '100%',
                videoId: id,
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,
                    'rel': 0
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });

            setTimeout(() => {
                const iframeElement = document.getElementById('youtube-iframe-placeholder');
                if(iframeElement) {
                    iframeElement.style.width = '90%';
                    iframeElement.style.maxWidth = '1100px';
                    iframeElement.style.height = '80vh';
                    iframeElement.style.border = 'none';
                    iframeElement.style.borderRadius = '12px';
                    iframeElement.style.boxShadow = '0 0 50px rgba(255,255,255,0.3)';
                }
            }, 100);
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                currentVideoIndex++; 
                if (currentVideoIndex < final5000Videos.length) {
                    const nextVideoId = final5000Videos[currentVideoIndex];
                    if (ytPlayer && ytPlayer.loadVideoById) {
                        ytPlayer.loadVideoById(nextVideoId);
                    }
                } else {
                    closeVideo();
                    alert("Saari 5000 videos khatam ho gayi hain!");
                }
            }
        }

        function closeVideo() {
            modal.classList.remove('open');
            if (ytPlayer && ytPlayer.destroy) {
                ytPlayer.destroy();
            }
            modal.innerHTML = ""; 
        }

        // Initialize Triggers
        window.onload = function() {
            loadVideos();
        };
    </script>
</body>
</html>
