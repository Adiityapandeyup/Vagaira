<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Video & Product Hub</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

/* HEADER */
header {
    background: #111;
    color: white;
    padding: 15px;
    text-align: center;
}

/* NAVBAR */
nav {
    display: flex;
    justify-content: center;
    background: #333;
}
nav a {
    color: white;
    padding: 10px 15px;
    text-decoration: none;
}
nav a:hover {
    background: #555;
}

/* SECTIONS */
section {
    padding: 20px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
}

/* CARD */
.card {
    background: white;
    padding: 10px;
    border-radius: 10px;
    box-shadow: 0 0 5px rgba(0,0,0,0.2);
}

/* VIDEO */
iframe {
    width: 100%;
    height: 200px;
    border-radius: 10px;
}

/* BUTTON */
.btn {
    display: inline-block;
    padding: 8px 12px;
    background: #007bff;
    color: white;
    border-radius: 5px;
    text-decoration: none;
}

/* FORM */
input, textarea {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
}

/* FOOTER */
footer {
    background: #111;
    color: white;
    text-align: center;
    padding: 15px;
    margin-top: 20px;
}
</style>
</head>

<body>

<header>
<h1>My Video & Product Website</h1>
<p>Watch & Shop in One Place</p>
</header>

<nav>
<a href="#videos">Videos</a>
<a href="#products">Products</a>
<a href="#contact">Contact</a>
</nav>

<!-- VIDEOS -->
<section id="videos">
<h2>🎥 Videos</h2>

<div class="grid">

<div class="card">
<iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ"></iframe>
<p>Video Title 1</p>
</div>

<div class="card">
<iframe src="https://www.youtube.com/embed/tgbNymZ7vqY"></iframe>
<p>Video Title 2</p>
</div>

</div>
</section>

<!-- PRODUCTS -->
<section id="products">
<h2>🛒 Products</h2>

<div class="grid">

<div class="card">
<img src="https://via.placeholder.com/250" width="100%">
<p>Product Name</p>
<a href="https://example.com" class="btn" target="_blank">Buy Now</a>
</div>

<div class="card">
<img src="https://via.placeholder.com/250" width="100%">
<p>Product Name 2</p>
<a href="https://example.com" class="btn" target="_blank">Buy Now</a>
</div>

</div>
</section>

<!-- CONTACT -->
<section id="contact">
<h2>📩 Contact / Feedback</h2>

<form onsubmit="submitForm(event)">
<input type="text" placeholder="Your Name" required>
<input type="email" placeholder="Your Email" required>
<textarea placeholder="Your Message"></textarea>
<button class="btn">Submit</button>
</form>

<p id="msg"></p>
</section>

<footer>
<p>© 2026 My Website | All Rights Reserved</p>
</footer>

<script>
function submitForm(e){
    e.preventDefault();
    document.getElementById("msg").innerText = "Thanks for your feedback!";
}
</script>

</body>
</html>
